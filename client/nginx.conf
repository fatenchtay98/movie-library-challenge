server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's perspective: the client calls relative
    # /api/... URLs, nginx forwards them to the server container. Keeps the
    # httpOnly auth cookie first-party and avoids cross-origin CORS/SameSite
    # complexity entirely.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (react-router) survive a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
