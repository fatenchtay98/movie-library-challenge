databases:
  - name: movie-library-db
    databaseName: movielib
    user: movielib
    plan: free

services:
  - type: web
    name: movie-library
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: movie-library-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # Render terminates TLS in front of the container, so the browser
      # always sees HTTPS here — unlike the local Docker Compose setup.
      - key: COOKIE_SECURE
        value: 'true'
